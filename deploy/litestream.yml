# Litestream replication config — continuous SQLite WAL shipping to a
# Cloudflare R2 bucket. Mounted read-only into the litestream compose service.
#
# Litestream is a pure WAL reader: it coexists with the two writers (crawl,
# analyze) and the read-only API without code changes. It complements — does
# NOT replace — the nightly backup.sh snapshot to a separate bucket; retire
# that only after restore drills have been verified for a quarter.
#
# All ${...} values come from /etc/civic-lens.env (see .env.example):
#   LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY  — R2 API token
#     scoped to the replication bucket only (separate from the rclone token).
#   LITESTREAM_R2_ENDPOINT  — https://<ACCOUNT_ID>.r2.cloudflarestorage.com
#   LITESTREAM_R2_BUCKET    — replication bucket name.
#
# Restore drill (run on the box, then integrity-check the output):
#   docker compose run --rm litestream restore \
#       -config /etc/litestream.yml -o /var/lib/civic-lens/tmp-restore.db \
#       /var/lib/civic-lens/data/civic_lens.db
#   sqlite3 /var/lib/civic-lens/tmp-restore.db "PRAGMA integrity_check;"

dbs:
  - path: /var/lib/civic-lens/data/civic_lens.db
    replicas:
      - type: s3
        endpoint: ${LITESTREAM_R2_ENDPOINT}
        region: auto
        bucket: ${LITESTREAM_R2_BUCKET}
        path: civic_lens.db
        sync-interval: 10s
        snapshot-interval: 24h
        retention: 168h
