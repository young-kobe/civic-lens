# Drop-in SSH config for /etc/ssh/sshd_config.d/99-civic-lens.conf. Drop-ins
# on Ubuntu 24.04 override the main sshd_config and take effect on the next
# `systemctl restart ssh.socket` (audit §1.17).

# Only key-based auth — passwords were already disabled during box prep,
# this re-asserts it so a later package upgrade resetting sshd_config
# doesn't silently open the door.
PermitRootLogin prohibit-password
PasswordAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Who may log in. `deployment` is the least-privileged user GitHub Actions
# uses; `root` stays for ops. Add more only when a new operator is
# onboarded, and remove them when they leave.
AllowUsers root deployment

# Brute-force and idle-session surface reduction.
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# No tunneling / forwarding — the VPS should not be a jump host.
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no

# Disable unused auth mechanisms that would silently accept later if
# PAM/GSSAPI modules land.
ChallengeResponseAuthentication no
GSSAPIAuthentication no
KerberosAuthentication no
UsePAM yes
