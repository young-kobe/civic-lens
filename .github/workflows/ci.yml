name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analysis/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r analysis/requirements.txt pip-audit
      - name: Dependency audit
        # Fails the build on any known HIGH/CRITICAL advisory in pinned deps
        # — catches freshly-disclosed CVEs between merges. (Audit §1.5.)
        run: pip-audit --requirement analysis/requirements.txt --strict
      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover analysis/tests

  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: ingest/go.sum
      - name: Vet
        working-directory: ingest
        run: go vet ./...
      - name: Test
        working-directory: ingest
        run: go test ./...
      - name: Build
        working-directory: ingest
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/civic-ingest

  ui:
    name: UI audit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Audit
        # Fail on HIGH/CRITICAL — MODERATE + LOW still reported but not gating.
        # (Audit §1.13.)
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: ui
        run: npm run typecheck
      - name: Build
        working-directory: ui
        run: npm run build
