name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet format CivicLens.slnx --verify-no-changes --no-restore
      - run: python3 tools/render-architecture.py --check
      - run: python3 tools/check-docs.py --check
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: docker version
      - run: python3 tools/test-shards.py --shards 4 --index ${{ matrix.shard }} --runsettings shard.runsettings
      - run: dotnet test tests/CivicLens.Tests --no-build --configuration Release --settings shard.runsettings
