# Civic Lens production stack (Hetzner CPX21). Local-dev overrides live in
# docker-compose.override.example.yml — copy to docker-compose.override.yml
# (gitignored); production never has an override file.
#
# Shape:
#   Always-on:  caddy (TLS + static UI + /api reverse proxy), api (uvicorn),
#               postgres, litestream (frozen-SQLite replication to R2 —
#               retires once the final cold artifact is archived post-cutover).
#   One-shots:  ingest + analyze under the "jobs" profile — never started by
#               `up`, only by the systemd timers as
#               `docker compose run --rm <service> ...` so the existing
#               OnFailure alert plumbing keeps watching exit codes.
#
# Data contract: the host dir /var/lib/civic-lens is bind-mounted at the SAME
# path inside every container, so the absolute paths in /etc/civic-lens.env
# (e.g. CIVIC_RAW_STORE_DIR) are valid on the host and in containers alike.
# Postgres reachability differs by vantage point: containers on the default
# bridge network use the service DNS name (…@postgres:5432); host-side tools
# (./run.sh, psql spot checks) use the loopback publish (…@127.0.0.1:5432).
#
# caddy runs with host networking: Docker-published ports bypass ufw, and the
# firewall pins :80/:443 to Cloudflare ranges — host networking preserves
# those semantics. The api publishes on loopback only, which caddy (being in
# the host namespace) reaches at 127.0.0.1:8000 exactly like the systemd era.
#
# CIVIC_ENV_FILE exists so dev checkouts can point at a local .env; unset it
# in production and the default /etc/civic-lens.env applies.

x-app-common: &app-common
  env_file: ${CIVIC_ENV_FILE:-/etc/civic-lens.env}
  volumes:
    - /var/lib/civic-lens:/var/lib/civic-lens
  working_dir: /var/lib/civic-lens
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    image: ghcr.io/young-kobe/civic-lens-web:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      # Install-time TLS material — origin cert/key + Cloudflare origin-pull
      # CA. Never in git, never in images (see deploy/README.md).
      - /etc/caddy/origin.crt:/etc/caddy/origin.crt:ro
      - /etc/caddy/origin.key:/etc/caddy/origin.key:ro
      - /etc/caddy/cloudflare-authenticated-origin-pull.pem:/etc/caddy/cloudflare-authenticated-origin-pull.pem:ro
      - /var/log/caddy:/var/log/caddy
      - caddy_state:/data
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    <<: *app-common
    image: ghcr.io/young-kobe/civic-lens-analysis:latest
    depends_on:
      postgres:
        condition: service_healthy
    # Bind 0.0.0.0 INSIDE the container (the loopback-only exposure is the
    # published-port line below). CIVIC_API_HOST/PORT from the env file are
    # intentionally not used here — container networking supersedes them.
    command: uvicorn analysis.src.api.server:app --host 0.0.0.0 --port 8000 --workers 1 --access-log
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.8

  litestream:
    image: litestream/litestream:0.3
    command: replicate -config /etc/litestream.yml
    env_file: ${CIVIC_ENV_FILE:-/etc/civic-lens.env}
    volumes:
      - /var/lib/civic-lens:/var/lib/civic-lens
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # The primary datastore — every service above and below reads/writes it.
  # POSTGRES_USER/POSTGRES_PASSWORD have no defaults on purpose (see
  # .env.example) so a missing credential fails `compose config` loudly
  # instead of silently starting an insecure/trust-auth DB.
  postgres:
    image: postgres:17-alpine
    env_file: ${CIVIC_ENV_FILE:-/etc/civic-lens.env}
    environment:
      POSTGRES_DB: civic_lens
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    command: >
      postgres -c shared_buffers=256MB -c work_mem=16MB -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d civic_lens"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # One-shots below: `docker compose run --rm ingest <subcommand> ...` /
  # `docker compose run --rm analyze`. The "jobs" profile keeps them out of
  # `up -d`; `compose run` activates the profile implicitly.
  ingest:
    <<: *app-common
    image: ghcr.io/young-kobe/civic-lens-ingest:latest
    profiles: [jobs]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.8

  analyze:
    <<: *app-common
    image: ghcr.io/young-kobe/civic-lens-analysis:latest
    profiles: [jobs]
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m analysis.src.scheduler.pipeline
    environment:
      # Soft wall-clock budget — same rationale as the old systemd
      # Environment= line; the hard ceiling stays in the timer unit.
      CIVIC_BUDGET_SECONDS: "6900"
    mem_limit: 1g
    cpus: 0.9

volumes:
  caddy_state:
  pgdata:
