# Civic Lens seed configuration
#
# Budget target: ~$50/month total operating cost. X credit spend is capped at
# $25/month via x.monthly_budget_cents + the x_api_budget persistent counter
# (walkthrough 048). News + Reddit are free. Hetzner + Gemini + R2 backups
# round out the remaining ~$23/month.

database:
  path: data/civic_lens.db
  raw_dir: data/raw

crawl:
  max_concurrency: 10
  request_timeout: 30s
  max_retries: 3
  rate_limit_per_sec: 1.0
  max_redirects: 5
  user_agent: "CivicLens/1.0 (+https://github.com/young-kobe/civic-lens)"
  stale_inflight_age: 10m

reddit:
  user_agent: "CivicLens/1.0 by u/civic-lens"
  # Subreddits balanced across left / center / right plus two structured
  # viewpoint subs (AskConservatives, AskALiberal) that tend to produce
  # higher-signal sentiment than hot-take aggregators. The old r/Liberal
  # sub was dropped — it's near-dead and its traffic was drowning
  # r/Conservative in the left/right parity math.
  subreddits:
    - politics
    - news
    - worldnews
    - PoliticalDiscussion
    - NeutralPolitics
    - moderatepolitics
    - Conservative
    - democrats
    - AskConservatives
    - AskALiberal
    - PoliticalHumor
    - geopolitics

x:
  # Bearer token comes from X_BEARER_TOKEN environment variable; never
  # put it in this file (seeds.yaml is tracked in git).
  user_agent: "CivicLens/1.0"

  # Per-session rate pacing (not the real budget limit — that's below).
  max_requests_hour: 30

  # Per-query tweet pull. X pricing is $0.005 per tweet + $0.010 per hydrated
  # user; keeping this low means the user-expansion cost stays bounded
  # (~8-12 unique authors per 10 tweets in practice).
  #
  # Walkthrough 056 dropped this from 10 → 8 to make room for the two new
  # official-timeline queries below without blowing the budget. Cycle
  # remains once/day at 04:00 UTC per civic-lens-x.timer. 11 queries × 8
  # tweets × 30 days × ~$0.0104 (tweet + user hydration amortized) ≈
  # $27.50/month, which fits comfortably under the $30 cap.
  max_tweets_per_query: 8

  # Hard ceiling enforced by the x_api_budget table (migration 017). When
  # the month-to-date estimated spend hits this, the runner aborts any
  # remaining queries for the month. Walkthrough 056 bumped this from
  # $25 → $30 to give headroom for the added official-timeline queries.
  monthly_budget_cents: 3000

  # Query composition (walkthrough 056 — "option C hybrid"):
  #
  #   1. Eight topic queries (what the sample audience is talking about).
  #   2. One pure-timeline query for the 9 highest-profile officials
  #      (president + VP + congressional leadership + party chairs) so
  #      their Verified Officials cards reflect their actual feed,
  #      including off-topic posts.
  #   3. One intersection query for the 7 cabinet secretaries + FBI
  #      director × all topic keywords — surfaces the cabinet-level
  #      signal on the shared topic axes without spending budget on
  #      their off-topic posts (their media profile is narrower).
  #
  # When handles on the timeline queries don't resolve (e.g. if the
  # registry's best-guess handle is wrong), the X API silently returns
  # zero results for that from:-clause — watch x_api_budget and the
  # narrative/sentiment aggregators' registry-match logs after the
  # first few runs to spot misses.
  political_queries:
    # Topic queries — de-duplicated from the old 21-query list in walkthrough 048.
    - "GOP OR Republican"
    - "Trump OR MAGA"
    - "Biden OR Democrats"
    - "Congress OR Senate"
    - "abortion OR SCOTUS OR Roe"
    - "immigration OR border OR ICE"
    - "inflation OR economy"
    - "2nd Amendment OR guns"

    # Verified-officials timeline — exec + congressional leadership + party chairs.
    # Pure from:-operators; every hit is authored by one of these 9 officials.
    - "from:POTUS OR from:VP OR from:realDonaldTrump OR from:JDVance OR from:SpeakerJohnson OR from:RepJeffries OR from:SteveScalise OR from:LeaderJohnThune OR from:SenSchumer OR from:ChairmanWhatley OR from:TheDemocrats"

    # Cabinet + FBI × topic intersection — only posts by these 7 officials
    # that touch one of the topic axes. Narrower surface but higher per-post
    # signal for the three-way topic-divergence panel.
    - "(from:SecRubio OR from:SecScottBessent OR from:SecWar OR from:PeteHegseth OR from:AGPamBondi OR from:Sec_Noem OR from:KristiNoem OR from:SecKennedy OR from:RobertKennedyJr OR from:FBIDirectorKash OR from:Kash_Patel) (GOP OR Republican OR Trump OR MAGA OR Biden OR Democrats OR Congress OR Senate OR abortion OR SCOTUS OR immigration OR border OR inflation OR economy OR guns)"

seeds:
  # Major news RSS feeds — left / center / right spread + neutral wire baseline.
  # Priority 10 = primary political desk; 9 = secondary; 8 = international.
  - url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
    type: rss
    priority: 10
  - url: https://feeds.washingtonpost.com/rss/politics
    type: rss
    priority: 10
  - url: https://feeds.npr.org/1001/rss.xml
    type: rss
    priority: 10
  - url: https://www.reuters.com/rssFeed/topNews
    type: rss
    priority: 10
  - url: https://feeds.bbci.co.uk/news/rss.xml
    type: rss
    priority: 8
  - url: http://rss.cnn.com/rss/cnn_allpolitics.rss
    type: rss
    priority: 10
  - url: http://feeds.foxnews.com/foxnews/politics
    type: rss
    priority: 10
  - url: https://rss.politico.com/politics-news.xml
    type: rss
    priority: 10
  - url: https://thehill.com/homenews/politics/feed/
    type: rss
    priority: 10
  - url: https://feeds.nbcnews.com/msnbc/public/politics
    type: rss
    priority: 10
  - url: https://feeds.feedburner.com/breitbart
    type: rss
    priority: 9
  - url: https://www.cbsnews.com/latest/rss/politics
    type: rss
    priority: 10
  # Additions (walkthrough 048) — wire-neutral baseline, progressive long-form,
  # conservative long-form, progressive investigative.
  - url: https://feeds.apnews.com/apnews
    type: rss
    priority: 10
  - url: https://api.axios.com/feed/politics
    type: rss
    priority: 9
  - url: https://feeds.a.dj.com/rss/RSSOpinion.xml
    type: rss
    priority: 9
  - url: https://thefederalist.com/feed/
    type: rss
    priority: 9
  - url: https://theintercept.com/feed/
    type: rss
    priority: 9
