# Civic Lens seed configuration
#
# Budget target: ~$75/month total operating cost. X credit spend is capped at
# $50/month via x.monthly_budget_cents + the x_api_budget persistent counter.
# That ceiling covers daily verified-officials timeline pulls (~$22/mo) plus
# the 8 topic queries at the X API's 10-tweet minimum (~$24/mo); the rest is
# headroom for the first-run user-by-username lookups and one-off retries.
# News + Reddit are free. Hetzner + Gemini + R2 backups round out the
# remaining ~$23/month.

database:
  path: data/civic_lens.db
  raw_dir: data/raw

crawl:
  max_concurrency: 10
  request_timeout: 30s
  max_retries: 3
  rate_limit_per_sec: 1.0
  max_redirects: 5
  user_agent: "CivicLens/1.0 (+https://github.com/young-kobe/civic-lens)"
  stale_inflight_age: 10m

# crawl_balance (optional, Postgres-only — Postgres-redesign Phase 2): caps
# how many docs per domain the frontier claims in a rolling window, so one
# prolific outlet cannot dominate a sample the way cbsnews (2,404 docs) has
# dominated npr (65) in production. Omit this section entirely to keep
# today's unlimited-claim behavior on both backends; the SQLite path never
# reads it regardless (frozen production behavior). Uncomment and tune once
# Postgres is live:
#
# crawl_balance:
#   # How far back the per-domain "already fetched" count looks (against
#   # raw.articles.fetched_at). Defaults to 24h if omitted.
#   window: 24h
#   # Cap applied to any domain not listed below. Omit or set to 0 for no
#   # default cap (domains without an explicit override are unlimited).
#   default_max_per_window: 50
#   # Per-domain overrides, keyed by the crawled host (lowercased, as the
#   # frontier's util.ExtractDomain produces it — e.g. "www.cbsnews.com" if
#   # that's the literal host in the feed, not the bare registrable domain).
#   # A cap of 0 blocks the domain outright.
#   domains:
#     www.cbsnews.com: 15
#     feeds.npr.org: 50

reddit:
  user_agent: "CivicLens/1.0 by u/civic-lens"
  # Subreddits balanced across left / center / right plus two structured
  # viewpoint subs (AskConservatives, AskALiberal) that tend to produce
  # higher-signal sentiment than hot-take aggregators. The old r/Liberal
  # sub was dropped — it's near-dead and its traffic was drowning
  # r/Conservative in the left/right parity math.
  subreddits:
    - politics
    - news
    - worldnews
    - PoliticalDiscussion
    - NeutralPolitics
    - moderatepolitics
    - Conservative
    - democrats
    - AskConservatives
    - AskALiberal
    - PoliticalHumor
    - geopolitics

x:
  # Bearer token comes from X_BEARER_TOKEN environment variable; never
  # put it in this file (seeds.yaml is tracked in git).
  user_agent: "CivicLens/1.0"

  # Per-session rate pacing (not the real budget limit — that's below).
  max_requests_hour: 30

  # Per-query tweet pull. The X /2/tweets/search/recent endpoint enforces
  # a minimum of 10 (HTTP 400 below); the client pads up defensively, so
  # smaller values here are silently raised. X pricing is $0.005 per tweet
  # + $0.010 per hydrated user; keeping this at the floor means the
  # user-expansion cost stays bounded (~8-12 unique authors per 10 tweets
  # in practice).
  max_tweets_per_query: 10

  # Hard ceiling enforced by the x_api_budget table (migration 017). When
  # the month-to-date estimated spend hits this, the runner aborts any
  # remaining queries for the month. Sized to fit daily officials
  # timelines + topic queries at the API's 10-tweet floor — see the
  # header comment for the breakdown.
  monthly_budget_cents: 5000

  # Officials path — runs BEFORE topic queries on every X ingest pass. The
  # runner reads verified_officials.yaml (resolved relative to THIS file's
  # directory, not the process working directory) and pulls the
  # user-timeline for each handle (primary + alternates). Posts land with
  # x_posts_raw.is_official_tier=1 so the analysis layer can route them
  # without re-running the LLM tier classifier. 5 tweets/handle × 37
  # distinct handles (16 primaries + 21 alternates, per AllHandles()) ≈ 185
  # tweets/run; fits within the $50 cap (monthly_budget_cents: 5000)
  # alongside the topic queries below. Leaving officials_list_path unset
  # uses the default `verified_officials.yaml` next to seeds.yaml.
  max_tweets_per_official: 5

  # Topic queries — what the sample audience is talking about. These run
  # AFTER the officials pass; if the budget is already spent on officials
  # the loop short-circuits cleanly. The two old `from:`-search queries
  # for officials' timelines were removed when the explicit officials
  # pass landed (2026-04-25); user-timeline calls give us the same
  # coverage without the search-index recency window.
  political_queries:
    - "GOP OR Republican"
    - "Trump OR MAGA"
    - "Biden OR Democrats"
    - "Congress OR Senate"
    - "abortion OR SCOTUS OR Roe"
    - "immigration OR border OR ICE"
    - "inflation OR economy"
    - "2nd Amendment OR guns"

seeds:
  # Major news RSS feeds — left / center / right spread + neutral wire baseline.
  # Priority 10 = primary political desk; 9 = secondary; 8 = international.
  - url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
    type: rss
    priority: 10
  - url: https://feeds.washingtonpost.com/rss/politics
    type: rss
    priority: 10
  - url: https://feeds.npr.org/1001/rss.xml
    type: rss
    priority: 10
  - url: https://www.reuters.com/rssFeed/topNews
    type: rss
    priority: 10
  - url: https://feeds.bbci.co.uk/news/rss.xml
    type: rss
    priority: 8
  - url: http://rss.cnn.com/rss/cnn_allpolitics.rss
    type: rss
    priority: 10
  - url: http://feeds.foxnews.com/foxnews/politics
    type: rss
    priority: 10
  - url: https://rss.politico.com/politics-news.xml
    type: rss
    priority: 10
  - url: https://thehill.com/homenews/politics/feed/
    type: rss
    priority: 10
  - url: https://feeds.nbcnews.com/msnbc/public/politics
    type: rss
    priority: 10
  - url: https://feeds.feedburner.com/breitbart
    type: rss
    priority: 9
  - url: https://www.cbsnews.com/latest/rss/politics
    type: rss
    priority: 10
  # Additions (walkthrough 048) — wire-neutral baseline, progressive long-form,
  # conservative long-form, progressive investigative.
  - url: https://feeds.apnews.com/apnews
    type: rss
    priority: 10
  - url: https://api.axios.com/feed/politics
    type: rss
    priority: 9
  - url: https://feeds.a.dj.com/rss/RSSOpinion.xml
    type: rss
    priority: 9
  - url: https://thefederalist.com/feed/
    type: rss
    priority: 9
  - url: https://theintercept.com/feed/
    type: rss
    priority: 9
