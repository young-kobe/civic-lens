# Civic Lens seed configuration
#
# Budget target: ~$50/month total operating cost. X credit spend is capped at
# $25/month via x.monthly_budget_cents + the x_api_budget persistent counter
# (walkthrough 048). News + Reddit are free. Hetzner + Gemini + R2 backups
# round out the remaining ~$23/month.

database:
  path: data/civic_lens.db
  raw_dir: data/raw

crawl:
  max_concurrency: 10
  request_timeout: 30s
  max_retries: 3
  rate_limit_per_sec: 1.0
  max_redirects: 5
  user_agent: "CivicLens/1.0 (+https://github.com/young-kobe/civic-lens)"
  stale_inflight_age: 10m

reddit:
  user_agent: "CivicLens/1.0 by u/civic-lens"
  # Subreddits balanced across left / center / right plus two structured
  # viewpoint subs (AskConservatives, AskALiberal) that tend to produce
  # higher-signal sentiment than hot-take aggregators. The old r/Liberal
  # sub was dropped — it's near-dead and its traffic was drowning
  # r/Conservative in the left/right parity math.
  subreddits:
    - politics
    - news
    - worldnews
    - PoliticalDiscussion
    - NeutralPolitics
    - moderatepolitics
    - Conservative
    - democrats
    - AskConservatives
    - AskALiberal
    - PoliticalHumor
    - geopolitics

x:
  # Bearer token comes from X_BEARER_TOKEN environment variable; never
  # put it in this file (seeds.yaml is tracked in git).
  user_agent: "CivicLens/1.0"

  # Per-session rate pacing (not the real budget limit — that's below).
  max_requests_hour: 30

  # Per-query tweet pull. X pricing is $0.005 per tweet + $0.010 per hydrated
  # user; keeping this low means the user-expansion cost stays bounded
  # (~8-12 unique authors per 10 tweets in practice). Tuning knob: bump back
  # toward 25 if you raise monthly_budget_cents; cap at 100 (X API max).
  max_tweets_per_query: 10

  # Hard ceiling enforced by the x_api_budget table (migration 017). When
  # the month-to-date estimated spend hits this, the runner aborts any
  # remaining queries for the month. $25 = 2500 cents buys roughly 2,400
  # tweets + user hydration at current pricing.
  monthly_budget_cents: 2500

  # Eight high-signal topics, de-duplicated from the old 21-query list.
  # `MAGA` alone removed because `Trump OR MAGA` subsumes it. Hyperlocal
  # Minnesota/Minneapolis queries removed. Markets-adjacent (Dollar/Stock/
  # Market) removed — too noisy for the political-sentiment signal. Added
  # abortion/SCOTUS and inflation/economy (two of the top political drivers
  # missing from the old list).
  political_queries:
    - "GOP OR Republican"
    - "Trump OR MAGA"
    - "Biden OR Democrats"
    - "Congress OR Senate"
    - "abortion OR SCOTUS OR Roe"
    - "immigration OR border OR ICE"
    - "inflation OR economy"
    - "2nd Amendment OR guns"

seeds:
  # Major news RSS feeds — left / center / right spread + neutral wire baseline.
  # Priority 10 = primary political desk; 9 = secondary; 8 = international.
  - url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
    type: rss
    priority: 10
  - url: https://feeds.washingtonpost.com/rss/politics
    type: rss
    priority: 10
  - url: https://feeds.npr.org/1001/rss.xml
    type: rss
    priority: 10
  - url: https://www.reuters.com/rssFeed/topNews
    type: rss
    priority: 10
  - url: https://feeds.bbci.co.uk/news/rss.xml
    type: rss
    priority: 8
  - url: http://rss.cnn.com/rss/cnn_allpolitics.rss
    type: rss
    priority: 10
  - url: http://feeds.foxnews.com/foxnews/politics
    type: rss
    priority: 10
  - url: https://rss.politico.com/politics-news.xml
    type: rss
    priority: 10
  - url: https://thehill.com/homenews/politics/feed/
    type: rss
    priority: 10
  - url: https://feeds.nbcnews.com/msnbc/public/politics
    type: rss
    priority: 10
  - url: https://feeds.feedburner.com/breitbart
    type: rss
    priority: 9
  - url: https://www.cbsnews.com/latest/rss/politics
    type: rss
    priority: 10
  # Additions (walkthrough 048) — wire-neutral baseline, progressive long-form,
  # conservative long-form, progressive investigative.
  - url: https://feeds.apnews.com/apnews
    type: rss
    priority: 10
  - url: https://api.axios.com/feed/politics
    type: rss
    priority: 9
  - url: https://feeds.a.dj.com/rss/RSSOpinion.xml
    type: rss
    priority: 9
  - url: https://thefederalist.com/feed/
    type: rss
    priority: 9
  - url: https://theintercept.com/feed/
    type: rss
    priority: 9
